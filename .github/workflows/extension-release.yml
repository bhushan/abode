name: Release extension

# Builds the installable zip. Dispatched by hand:
#
#   gh workflow run extension-release.yml --ref main
#
# Pass a tag to also cut a GitHub release from it; leave it empty to just get
# the zip as an artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as, e.g. v0.5.0. Leave empty for an artifact only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      # Chrome wants the manifest at the zip root, so zip the dist contents, not the folder
      - name: Zip
        run: |
          cd apps/extension/dist
          zip -r "$GITHUB_WORKSPACE/abode-extension-v${{ steps.ver.outputs.version }}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: abode-extension-v${{ steps.ver.outputs.version }}
          path: abode-extension-v${{ steps.ver.outputs.version }}.zip

      - name: Release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: abode-extension-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
