<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Abode">
  <title>Abode</title>
  <!-- An A and a B sharing one stem. The stem gradients from the A's blue into
       the B's amber: two people, one wall between them, meeting in the middle. -->
  <defs>
    <linearGradient id="abStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 14 L14 86" stroke="#1a73e8"/>
    <path d="M26 62 H52" stroke="#1a73e8"/>
    <path d="M52 14 C80 17 80 45 52 50 C86 53 86 83 52 86" stroke="#d97706"/>
    <path d="M52 14 V86" stroke="url(#abStem)"/>
  </g>
</svg>
